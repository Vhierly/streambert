name: Build & Upload MacOS Artifacts
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also attach the .dmg to a GitHub Release"
        type: boolean
        default: true
      tag:
        description: "Release tag (blank = derive from package.json version)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            node_modules
          key: macos-electron-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        run: npm ci
      - name: Build macOS (universal)
        run: npm run dist:mac

      - name: Checksum the artifacts
        # The in-app auto-updater does not verify integrity on the binaries it
        # downloads, so publish the digests alongside the files.
        run: |
          cd dist
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Attach to a GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${TAG:-v$(node -p "require('./package.json').version")}"
          echo "Publishing to $TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "macOS universal build (Apple Silicon + Intel), produced by GitHub Actions." \
              --target "${{ github.sha }}"
          fi
          # --clobber so a rerun replaces the asset instead of failing.
          gh release upload "$TAG" dist/*.dmg dist/SHA256SUMS.txt --clobber
          echo "--- assets on $TAG ---"
          gh release view "$TAG" --json assets -q '.assets[] | "\(.name)  \(.size) bytes"'
